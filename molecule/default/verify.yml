---
- name: Verify Mastodon
  hosts: all
  become: true
  gather_facts: false

  vars:
    mastodon_verify_web_url: "http://{{ mastodon_web_container_http_host_bind_port }}"
    mastodon_verify_streaming_url: "http://{{ mastodon_streaming_container_http_host_bind_port }}"

    # Rails host authorization admits LOCAL_DOMAIN, and force_ssl redirects any
    # request that does not claim to have reached it over HTTPS through a proxy.
    mastodon_verify_request_headers:
      Host: "{{ mastodon_hostname }}"
      X-Forwarded-Proto: https

    # The docker CLI is invoked directly here and below: the ansible-lint
    # environment used by pre-commit has no collections installed, so
    # community.docker.* would fail the playbook syntax check.
    mastodon_verify_rails_runner:
      - docker
      - exec
      - --env=RAILS_ENV=production
      - "--env=MOLECULE_USERNAME={{ mastodon_molecule_username }}"
      - "--env=MOLECULE_STATUS_TEXT={{ mastodon_molecule_status_text }}"
      - mastodon-web
      - bin/rails
      - runner

    mastodon_verify_tootctl:
      - docker
      - exec
      - --env=RAILS_ENV=production
      - mastodon-web
      - bin/tootctl

    mastodon_verify_containers:
      - mastodon-sidekiq
      - mastodon-web
      - mastodon-streaming

    mastodon_verify_units:
      - mastodon-sidekiq.service
      - mastodon-web.service
      - mastodon-streaming.service
      - postgres.service
      - valkey.service

  tasks:
    - name: Verify that Mastodon works
      block:
        # The role is not included in this playbook, so its defaults are not in
        # scope. Reading defaults/main.yml directly ties the version assertion
        # below.
        - name: Load the role defaults
          ansible.builtin.include_vars:
            file: "{{ lookup('env', 'MOLECULE_PROJECT_DIRECTORY') }}/defaults/main.yml"
            name: mastodon_defaults

        # ------------------------------------------------------------------
        # The units are up
        # ------------------------------------------------------------------

        - name: Wait for the Mastodon systemd services to become active (up to 150s each)
          ansible.builtin.systemd_service:
            name: "{{ item }}"
          register: mastodon_services
          until: mastodon_services.status.ActiveState == 'active'
          retries: 30
          delay: 5
          loop: "{{ mastodon_verify_units }}"
          # So that giving up is reported by the assertion below rather than as a
          # wall of systemd unit properties.
          failed_when: false

        # `Restart=always` in the systemd units means that even a container which
        # crashes and gets restarted reads as active here, so this is a
        # precondition rather than a result.
        - name: Assert the Mastodon systemd services are active
          ansible.builtin.assert:
            that: mastodon_services.results | map(attribute='status.ActiveState') | unique | list == ['active']
            fail_msg: >-
              Not every service is active:
              {{ dict(mastodon_verify_units | zip(mastodon_services.results | map(attribute='status.ActiveState'))) }}
            success_msg: "Every systemd service is active"

        - name: Retrieve the Mastodon systemd services log for debugging
          when: mastodon_debug_service_enabled | bool
          ansible.builtin.command:
            cmd: "journalctl --no-pager --output=cat --unit={{ item }}"
          changed_when: false
          loop: "{{ mastodon_verify_units }}"

        # ------------------------------------------------------------------
        # Mastodon answers, on the pinned version
        # ------------------------------------------------------------------

        # A fresh database is migrated from scratch by the web container before
        # Puma starts (`mastodon_web_migration_enabled`).
        - name: Wait for Mastodon web to report itself healthy (up to 20 minutes)
          ansible.builtin.uri:
            url: "{{ mastodon_verify_web_url }}/health"
            headers: "{{ mastodon_verify_request_headers }}"
            follow_redirects: none
            status_code: [200, 301, 403, 500, 502, 503]
            return_content: true
          register: mastodon_health
          until: mastodon_health.status == 200 and mastodon_health.content | trim == 'OK'
          retries: 120
          delay: 10

        - name: Record when the Mastodon web container started
          ansible.builtin.command:
            argv: [docker, inspect, --format, "{{ '{{' }}.State.StartedAt{{ '}}' }}", mastodon-web]
          register: mastodon_web_started_at
          changed_when: false

        - name: Read the image each Mastodon container runs
          ansible.builtin.command:
            argv: [docker, inspect, --format, "{{ '{{' }}.Config.Image{{ '}}' }}", "{{ item }}"]
          register: mastodon_container_images
          changed_when: false
          loop: "{{ mastodon_verify_containers }}"

        - name: Assert every Mastodon container runs the pinned tag
          ansible.builtin.assert:
            that: mastodon_container_images.results | map(attribute='stdout') | map('trim') | map('split', ':') | map('last') | unique | list == [mastodon_defaults.mastodon_version]
            fail_msg: >-
              Expected every container on {{ mastodon_defaults.mastodon_version }}, got
              {{ dict(mastodon_verify_containers | zip(mastodon_container_images.results | map(attribute='stdout'))) }}
            success_msg: "Sidekiq, web and streaming all run {{ mastodon_defaults.mastodon_version }}"

        - name: Fetch Mastodon instance information
          ansible.builtin.uri:
            url: "{{ mastodon_verify_web_url }}/api/v2/instance"
            headers: "{{ mastodon_verify_request_headers }}"
          register: mastodon_instance

        - name: Assert Mastodon reports the pinned version and the configured domain
          ansible.builtin.assert:
            that:
              - mastodon_instance.json.version == mastodon_defaults.mastodon_version | regex_replace('^v', '')
              - mastodon_instance.json.domain == mastodon_hostname
            fail_msg: >-
              Expected version {{ mastodon_defaults.mastodon_version }} on {{ mastodon_hostname }}, got
              version {{ mastodon_instance.json.version }} on {{ mastodon_instance.json.domain }}
            success_msg: "Mastodon {{ mastodon_instance.json.version }} is serving {{ mastodon_instance.json.domain }}"

        - name: Wait for the Mastodon streaming server to report itself healthy (up to 150s)
          ansible.builtin.uri:
            url: "{{ mastodon_verify_streaming_url }}/api/v1/streaming/health"
            status_code: [200, 500, 502, 503]
            return_content: true
          register: mastodon_streaming_health
          until: mastodon_streaming_health.status == 200 and mastodon_streaming_health.content | trim == 'OK'
          retries: 30
          delay: 5

        # ------------------------------------------------------------------
        # Configuration reaches the processes, not just the files on disk
        # ------------------------------------------------------------------

        - name: Read TZ from inside each Mastodon container
          ansible.builtin.command:
            argv: [docker, exec, "{{ item }}", printenv, TZ]
          register: mastodon_container_tz
          changed_when: false
          loop: "{{ mastodon_verify_containers }}"

        - name: Assert templates/env.j2 reached every Mastodon container
          ansible.builtin.assert:
            that: mastodon_container_tz.results | map(attribute='stdout') | map('trim') | unique | list == [mastodon_environment_variables_tz]
            fail_msg: >-
              Expected TZ={{ mastodon_environment_variables_tz }} everywhere, got
              {{ dict(mastodon_verify_containers | zip(mastodon_container_tz.results | map(attribute='stdout'))) }}
            success_msg: "TZ={{ mastodon_environment_variables_tz }} in Sidekiq, web and streaming"

        - name: Inspect migrations, Sidekiq and the Redis database from inside Mastodon
          ansible.builtin.command:
            argv: "{{ mastodon_verify_rails_runner + [mastodon_verify_introspection_script] }}"
          vars:
            mastodon_verify_introspection_script: |
              require "sidekiq/api"
              conn = ActiveRecord::Base.connection
              puts "DB_NAME=#{conn.current_database}"
              puts "MIGRATIONS_APPLIED=#{conn.select_value('SELECT count(*) FROM schema_migrations')}"
              puts "MIGRATIONS_PENDING=#{ActiveRecord::Base.connection_pool.migration_context.needs_migration?}"
              puts "SIDEKIQ_PROCESSES=#{Sidekiq::ProcessSet.new.size}"
              puts "SIDEKIQ_REDIS_CLIENT=#{Sidekiq.redis { |c| c.call('CLIENT', 'INFO') }}"
          register: mastodon_introspection
          changed_when: false
          until: "'SIDEKIQ_PROCESSES=0' not in mastodon_introspection.stdout_lines"
          retries: 10
          delay: 6

        - name: Assert migrations ran against the configured database and Sidekiq uses the configured Redis database
          ansible.builtin.assert:
            that:
              - "('DB_NAME=' ~ mastodon_database_name) in mastodon_introspection.stdout_lines"
              - "'MIGRATIONS_PENDING=false' in mastodon_introspection.stdout_lines"
              - "mastodon_introspection.stdout is search('SIDEKIQ_REDIS_CLIENT=.* db=' ~ mastodon_redis_database ~ ' ')"
            fail_msg: "{{ mastodon_introspection.stdout_lines }}"
            success_msg: >-
              {{ mastodon_introspection.stdout_lines | select('search', '^(DB_NAME|MIGRATIONS_|SIDEKIQ_PROCESSES)') | join(', ') }},
              Sidekiq on Redis database {{ mastodon_redis_database }}

        # ------------------------------------------------------------------
        # An account and a status make the round trip
        # ------------------------------------------------------------------

        # The same invocation as tasks/util/ensure_user_registered.yml, which the
        # scenario skips (molecule-notest) because it runs mid-role, before the
        # services it needs are started.
        - name: Create the Mastodon owner account with tootctl
          ansible.builtin.command:
            argv: >-
              {{
                mastodon_verify_tootctl
                + ['accounts', 'create', mastodon_molecule_username,
                   '--email', mastodon_molecule_email, '--confirmed', '--role', 'Owner']
              }}
          register: mastodon_tootctl_create
          changed_when: true
          failed_when: >-
            mastodon_tootctl_create.rc != 0
            or mastodon_tootctl_create.stdout is not search('New password: \w+')

        - name: Approve the Mastodon owner account with tootctl
          ansible.builtin.command:
            argv: "{{ mastodon_verify_tootctl + ['accounts', 'modify', mastodon_molecule_username, '--approve'] }}"
          changed_when: true

        - name: Look up the Mastodon owner account over the API
          ansible.builtin.uri:
            url: "{{ mastodon_verify_web_url }}/api/v1/accounts/lookup?acct={{ mastodon_molecule_username }}"
            headers: "{{ mastodon_verify_request_headers }}"
          register: mastodon_account_lookup

        # Proves the lookup above discriminates, rather than returning whatever exists.
        - name: Look up an account that was never created
          ansible.builtin.uri:
            url: "{{ mastodon_verify_web_url }}/api/v1/accounts/lookup?acct=nobody{{ mastodon_molecule_username }}"
            headers: "{{ mastodon_verify_request_headers }}"
            status_code: [404]
          register: mastodon_absent_lookup

        # PostStatusService hands fan-out to Sidekiq (DistributionWorker), which is
        # what puts the status on its author's home feed in Redis. Finding it there
        # is evidence that Sidekiq is consuming jobs, not merely connected.
        #
        # Mastodon only maintains home feeds for users who signed in recently
        # (`FeedManager#push_to_home`), and an account created with tootctl never
        # has, so the script records a sign-in first.
        - name: Post a status and wait for Sidekiq to fan it out
          ansible.builtin.command:
            argv: "{{ mastodon_verify_rails_runner + [mastodon_verify_status_script] }}"
          vars:
            mastodon_verify_status_script: |
              account = Account.find_local!(ENV.fetch("MOLECULE_USERNAME"))
              account.user.update!(current_sign_in_at: Time.now.utc)
              status = PostStatusService.new.call(account, text: ENV.fetch("MOLECULE_STATUS_TEXT"), visibility: :public)
              puts "STATUS_ID=#{status.id}"
              redis = Redis.new(url: ENV.fetch("REDIS_URL"))
              fanned_out = false
              90.times do
                fanned_out = !redis.zscore("feed:home:#{account.id}", status.id).nil?
                break if fanned_out
                sleep 1
              end
              puts "IN_HOME_FEED=#{fanned_out}"
          register: mastodon_status_post
          changed_when: true
          failed_when: >-
            mastodon_status_post.rc != 0
            or 'IN_HOME_FEED=true' not in mastodon_status_post.stdout_lines

        - name: Read the status back over the API
          ansible.builtin.uri:
            url: "{{ mastodon_verify_web_url }}/api/v1/statuses/{{ mastodon_status_post.stdout | regex_search('STATUS_ID=(\\d+)', '\\1') | first }}"
            headers: "{{ mastodon_verify_request_headers }}"
          register: mastodon_status_read

        - name: Assert the status read back is the one posted, by the account created
          ansible.builtin.assert:
            that:
              - mastodon_molecule_status_text in mastodon_status_read.json.content
              - mastodon_status_read.json.account.id == mastodon_account_lookup.json.id
              - mastodon_status_read.json.account.username == mastodon_molecule_username
            fail_msg: "Read back {{ mastodon_status_read.json.content }} by {{ mastodon_status_read.json.account.username }}"
            success_msg: >-
              Status {{ mastodon_status_read.json.id }} by {{ mastodon_molecule_username }} was fanned out
              by Sidekiq and read back over the API

        - name: Verify nothing was quietly restarting while all of that was being checked
          when: "mastodon_restarts_check_enabled | bool"
          block:
            # `Restart=always` means a unit reads `active` while it is crash-looping.
            # The window starts here, with everything already answering, because
            # restarts from before this point say nothing.
            - name: Sample the restart counters
              ansible.builtin.systemd_service:
                name: "{{ item }}"
              register: mastodon_restarts_before
              loop: "{{ mastodon_verify_units }}"

            # Comfortably longer than the units' `RestartSec=30`, so a crash loop has
            # to tick at least once inside the window.
            - name: Watch the services for 45 seconds
              ansible.builtin.pause:
                seconds: 45

            - name: Sample the restart counters again
              ansible.builtin.systemd_service:
                name: "{{ item }}"
              register: mastodon_restarts_after
              loop: "{{ mastodon_verify_units }}"

            - name: Assert no service restarted while it was up
              ansible.builtin.assert:
                that:
                  - mastodon_restarts_after.results | map(attribute='status.NRestarts') | list == mastodon_restarts_before.results | map(attribute='status.NRestarts') | list
                  - mastodon_restarts_after.results | map(attribute='status.ActiveState') | unique | list == ['active']
                fail_msg: >-
                  A service restarted while it was supposedly up, so `active` was hiding a crash loop.
                  Before:
                  {% for unit, restarts in mastodon_verify_units | zip(mastodon_restarts_before.results | map(attribute='status.NRestarts')) %}{{ restarts }} ({{ unit }}){% if not loop.last %}, {% endif %}{% endfor %},
                  after:
                  {% for unit, restarts in mastodon_verify_units | zip(mastodon_restarts_after.results | map(attribute='status.NRestarts')) %}{{ restarts }} ({{ unit }}){% if not loop.last %}, {% endif %}{% endfor %}
                success_msg: >-
                  None of the services restarted over 45 seconds of watching (restarts so far:
                  {% for unit, restarts in mastodon_verify_units | zip(mastodon_restarts_after.results | map(attribute='status.NRestarts')) %}{{ restarts }} ({{ unit }}){% if not loop.last %}, {% endif %}{% endfor %})

        - name: Show the Mastodon verification summary
          ansible.builtin.debug:
            msg:
              - "Mastodon systemd: {% for unit, state in mastodon_verify_units | zip(mastodon_services.results | map(attribute='status.ActiveState')) %}{{ unit }} ({{ state }}){% if not loop.last %}, {% endif %}{% endfor %}"
              - "Mastodon restarts: {% for unit, restarts in mastodon_verify_units | zip(mastodon_restarts_after.results | default([]) | map(attribute='status.NRestarts')) %}{{ restarts }} ({{ unit }}){% if not loop.last %}, {% endif %}{% endfor %}"
              - "Mastodon version: {{ mastodon_instance.json.version }} (tag {{ mastodon_defaults.mastodon_version }})"
              - "Mastodon web container started at: {{ mastodon_web_started_at.stdout | trim }}"
              - "Mastodon {{ mastodon_introspection.stdout_lines | select('search', '^(DB_NAME|MIGRATIONS_|SIDEKIQ_PROCESSES)') | join(', ') }}"
              - "Mastodon round trip: account {{ mastodon_account_lookup.json.id }}, status {{ mastodon_status_read.json.id }}, absent lookup {{ mastodon_absent_lookup.status }}"

      rescue:
        # Whatever went wrong, the reason is almost always in the systemd service logs.
        - name: Retrieve the Mastodon systemd service logs
          ansible.builtin.command:
            cmd: "journalctl --no-pager --output=cat --lines=200 --unit={{ item }}"
          register: mastodon_service_logs
          changed_when: false
          loop:
            - mastodon-sidekiq.service
            - mastodon-web.service
            - mastodon-streaming.service

        - name: Show the Mastodon systemd service logs
          ansible.builtin.debug:
            msg: "{{ item.stdout_lines }}"
          loop: "{{ mastodon_service_logs.results }}"
          loop_control:
            label: "{{ item.item }}"

        - name: Fail because verification did not pass
          ansible.builtin.fail:
            msg: "Mastodon verification failed. The systemd service logs are printed above."
